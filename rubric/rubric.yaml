# ClearFrame rubric: the creative director's policy and the Slack card's words.
#
# The worker, the agent and the evidence page read this file through
# rubric/rubric.py, which accepts only a small part of YAML: two-space
# indentation, mappings, lists of plain values, double-quoted strings and
# full-line comments. Keep to that and the loader stays standard library only.
# Names follow contracts/README.md; tests/test_rubric.py holds this file to it.

schema: "clearframe.rubric/1"

# The checks the worker runs. The noted checks come from what Blake's studio
# rejects takes for: wrong road lines, arrows or road conditions, objects that
# don't belong in the scene, and unrealistic lighting. road_markings is the
# default; the second noted check is added once Blake's bad takes show which
# flaw comes up most, and only after its issue type is in the contract.
# extra_finger is the last fallback. exposure_flicker is a background check.
checks:
  - exposure_flicker
  - road_markings

# exposure_flicker is measured by code, not the model, on every take. No flicker
# is added to any take; it's demoed only if Blake's clips show a jump. The
# threshold is the mean brightness change between consecutive frames, 0-255,
# that starts a spike. Both settings are a first guess until they're checked
# against the worker's brightness series (#5).
flicker_threshold: 8.0
# A spike must come back within this many frames to count as flicker. A change
# that stays longer (a cut, the car driving into shadow) is not reported.
# 16 frames is two thirds of a second at 24 fps. Blake's Shot 3 flicker clip
# dims from about 97 to 33 three times, for 16, 6 and 15 frames; 6 caught only
# the shortest. Its largest jump is 33.8 against a threshold of 8.0, and the
# clean Shot 3 clip's is 1.0.
flicker_return_frames: 16

# The names allowed to approve on the evidence page. They never reach Slack.
approvers:
  - "Creative director"

# One entry per enabled check, written from the difference between Blake's bad
# and good prompts; a fallback may keep an entry ready. The order of the entries
# is rubric order: prompt-fix appends fixes in it, and the card counts follow it.
# Within an entry, prompt-fix appends one line per label, in the order Don't
# include, Add, Make sure, and skips a line version 1 already contains. The fixed
# takes are generated from exactly this text, so a change here means
# regenerating them.
fix_library:
  exposure_flicker:
    dont_include: "flicker, strobing or sudden jumps in brightness."
    make_sure: "exposure stays steady from frame to frame."
  road_markings:
    make_sure: "lane arrows point in the direction of travel and lane lines stay continuous."
  extra_finger:
    make_sure: "every hand has exactly five fingers in every frame."

fix_labels:
  dont_include: "Don't include"
  add: "Add"
  make_sure: "Make sure"

# The Slack card. Templates fill {placeholders} from the contract's card fields
# only; the card builder joins the lines with a newline.
card:
  status_labels:
    review_pending: "reviewing"
    needs_confirmation: "needs confirmation"
    flagged: "flagged"
    clean: "clean"
    accepted_as_is: "accepted as is"
    approved_for_regeneration: "approved for regeneration"

  # Counted per state and issue type: one label for 1, the other for more.
  # Dismissed notes aren't counted.
  state_labels:
    measured:
      one: "measured anomaly"
      many: "measured anomalies"
    confirmed:
      one: "confirmed note"
      many: "confirmed notes"
    candidate:
      one: "candidate note"
      many: "candidate notes"

  category_labels:
    exposure_flicker: "exposure"
    road_markings: "road markings"
    extra_finger: "extra finger"

  # One count, as in "1 candidate note (road markings)". Counts go in the order
  # of state_labels, then rubric order, joined by count_separator.
  count: "{count} {state} ({category})"
  count_separator: ", "

  # Shown in place of the status when a check ended in error. Several errored
  # checks share one label, their categories joined by count_separator.
  check_error: "check error ({category})"

  shot_card:
    header: "ClearFrame · Shot {shot} · {reviewed} of {expected_takes} takes reviewed"
    # One line per take that isn't clean, in take order.
    take: "{take_id}: {status} · {counts}"
    take_no_counts: "{take_id}: {status}"
    clean: "Clean: {clean_takes}"
    clean_none: "Clean: none"
    clean_separator: ", "
    link: "Evidence, on the GB10: {link}"

  retake_card:
    header: "ClearFrame · Retake {take_id} of {parent_take_id} · {status} · {counts}"
    header_no_counts: "ClearFrame · Retake {take_id} of {parent_take_id} · {status}"
    link: "Evidence, on the GB10: {link}"
